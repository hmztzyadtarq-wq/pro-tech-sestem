<noscript><h1>حلو الملك</h1><p>أجود الحلويات الشرقية والغربية والمخبوزات بمكونات طازة، اطلب أونلاين واستلم من أقرب فرع أو بالتوصيل لحد باب بيتك. الخط الساخن: 16312. فعّل JavaScript لتصفح المنيو.</p></noscript>

<script>
/* ---------- إعدادات Firebase ---------- */
firebase.initializeApp({
  apiKey: "AIzaSyCel1QXKeChW1zVhQn4I8k8lVrD5c-OX9s",
  authDomain: "hellw-elmalek.firebaseapp.com",
  projectId: "hellw-elmalek",
  storageBucket: "hellw-elmalek.firebasestorage.app",
  messagingSenderId: "742581978284",
  appId: "1:742581978284:web:81bc15b3a2168b5ecb4b09"
});
const auth = firebase.auth();                               // تسجيل الدخول
const db = firebase.firestore();                            // قاعدة البيانات
db.settings({ experimentalAutoDetectLongPolling: true });   // اتصال أثبت لو الشبكة بتقفل WebChannel
const TS = firebase.firestore.FieldValue.serverTimestamp;   // وقت السيرفر
// Firebase Auth بيحتاج إيميل، فرقم الموبايل بيتحوّل لإيميل داخلي (العميل مش بيشوفه)
const phoneEmail = (p) => p + '@helwelmalek.app';

/* تحميل خفيف عشان نوفّر القراءات:
   - الأقسام والفروع والإعدادات + المنتجات اللي الأدمن اختارها للرئيسية بس (مش كل المنتجات)
   - باقي المنتجات بيحمّلها script.js لما الزائر يفتح القسم أو يبحث، وبيخزنها على جهازه
   - بنقرا مستند settings/meta (قراءة واحدة): لو رقم النسخة مطابق للمخزن، الموقع بيفتح فورًا من غير أي تحميل
   - لو الأدمن غيّر حاجة، بنحدّث النسخة في الخلفية وبيظهر شريط "فيه تحديثات" */
(function () {
  const CK = 'hm_core_v4';
  const HOME_SECTIONS = ['الأكثر رواجًا', 'المنتجات الجديده', 'تشكيلة مميزة'];   // لازم تطابق HOME_SECTIONS في admin.js
  const rows = (q) => q.docs.map(d => ({ id: d.id, ...d.data() }));
  const one = (r) => r.exists ? r.data() : {};
  const pull = (v) => Promise.all([
    db.collection('categories').orderBy('order').get(),
    db.collection('branches').get(),
    db.collection('settings').doc('home').get(),
    db.collection('settings').doc('promos').get(),
    db.collection('settings').doc('brand').get(),
    db.collection('settings').doc('loyalty').get(),
    db.collection('products').where('section', 'in', HOME_SECTIONS).get(),
    db.collection('offers').get()
  ]).then(([c, b, h, pr, br, ly, p, of]) => ({ cats: rows(c), branches: rows(b), settings: { ...one(h), promos: one(pr) }, brand: one(br), loy: one(ly), prods: rows(p), offers: rows(of), v: v || 0, t: Date.now() }));
  const retry = (fn) => fn().catch(() => new Promise(r => setTimeout(r, 1500)).then(fn));
  const showUpd = () => { const u = document.getElementById('upd'); u.hidden = false; u.onclick = () => location.reload(); };
  const save = (d) => { try { localStorage.setItem(CK, JSON.stringify(d)); } catch (e) {} };

  // مراقبة رقم النسخة (الأدمن بيغيّره مع كل إضافة/تعديل): قراءة واحدة + قراءة لكل تغيير بس
  let known = null, gotV;
  const metaP = new Promise(r => { gotV = r; });
  db.collection('settings').doc('meta').onSnapshot((s) => {
    const v = s.exists ? (s.data().v || 0) : 0;
    if (known === null) { known = v; gotV(v); return; }
    if (v !== known) { known = v; showUpd(); }
  }, () => gotV(null));

  function boot() { const s = document.createElement('script'); s.src = 'script.js'; document.body.appendChild(s); }

  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(CK) || 'null'); } catch (e) {}

  if (cached && cached.cats && cached.offers) {                        // زيارة متكررة: افتح فورًا من المخزن
    window.REMOTE = cached; boot();
    metaP.then(v => { if (v === null || v === (cached.v || 0)) return; retry(() => pull(v)).then(d => { save(d); showUpd(); }).catch(() => {}); });
  } else {                                            // أول زيارة: استنى البيانات (لحد 15 ثانية)
    const fresh = metaP.then(v => retry(() => pull(v))).then(d => { save(d); window.REMOTE = d; return d; });
    Promise.race([fresh, new Promise(r => setTimeout(r, 15000))]).catch(() => {}).then(() => {
      boot();
      if (!window.REMOTE) fresh.then(() => showUpd()).catch(() => {});   // لو اتأخرت، نعرض شريط التحديث أول ما توصل
    });
  }
})();
</script>
