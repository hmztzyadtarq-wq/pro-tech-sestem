<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تسجيل الدخول - Bro Tech ProTech</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDLD-Y6d7LcyqB0rf3YYbJLTFHDXUsWQNM",
            authDomain: "protech-system.firebaseapp.com",
            projectId: "protech-system",
            storageBucket: "protech-system.firebasestorage.app",
            messagingSenderId: "184422532312",
            appId: "1:184422532312:web:76df7769c281c66fca43ad",
            measurementId: "G-1RRP97BPJC"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const DEFAULT_PASSWORD = 'protech2026';

        // لو أصلاً داخل، نوديه على طول للوحة المؤشرات
        if(localStorage.getItem('protech_logged_in') === 'true') {
            window.location.href = "index.html";
        }

        async function getSavedPassword() {
            try {
                const docRef = doc(db, "protech_data", "main_store");
                const docSnap = await getDoc(docRef);
                if(docSnap.exists()) {
                    const data = docSnap.data();
                    if(data.settings && data.settings.password) return data.settings.password;
                }
            } catch(e) {
                console.error('تعذر الاتصال بقاعدة البيانات، سيتم التحقق محلياً:', e);
            }
            try {
                let local = JSON.parse(localStorage.getItem('protech_settings'));
                if(local && local.password) return local.password;
            } catch(e) {}
            return DEFAULT_PASSWORD;
        }

        window.attemptLogin = async function(e) {
            e.preventDefault();
            let input = document.getElementById('passwordInput');
            let btn = document.getElementById('loginBtn');
            let errorBox = document.getElementById('loginError');
            errorBox.style.display = 'none';

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحقق...';

            let savedPassword = await getSavedPassword();

            if(input.value === savedPassword) {
                localStorage.setItem('protech_logged_in', 'true');
                window.location.href = "index.html";
            } else {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-right-to-bracket"></i> دخول';
                errorBox.style.display = 'flex';
                input.value = '';
                input.focus();
            }
        };
    </script>

    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --success: #10b981;
            --dark: #0f172a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        html, body { height: 100%; direction: rtl; text-align: right; }
        body {
            background: radial-gradient(circle at 20% 20%, #16213e 0%, var(--dark) 55%, #060a14 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-card {
            background: #111c33;
            border: 1px solid #23304d;
            border-radius: 16px;
            width: 400px;
            max-width: 100%;
            padding: 36px 30px 30px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.5);
            text-align: center;
        }
        .logo-circle {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            color: #fff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; margin: 0 auto 14px;
            box-shadow: 0 6px 18px rgba(59,130,246,0.35);
        }
        h2 { font-size: 20px; margin-bottom: 4px; }
        .subtitle { color: #38bdf8; font-size: 12px; letter-spacing: .5px; margin-bottom: 22px; font-weight: 600; }
        .form-group { margin-bottom: 16px; text-align: right; }
        label { display: block; margin-bottom: 7px; font-size: 13px; color: #cbd5e1; font-weight: 600; }
        input[type="password"], input[type="text"] {
            width: 100%; padding: 13px 14px;
            background: #0b1526; color: #fff;
            border: 1px solid #2b3a5a; border-radius: 8px;
            font-size: 14.5px; box-sizing: border-box;
        }
        input:focus { outline: none; border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(59,130,246,0.25); }
        .btn-login {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            color: #fff; border: none; border-radius: 9px;
            font-weight: 700; cursor: pointer; font-size: 16px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 8px 18px rgba(30,58,138,0.35);
            transition: transform .15s;
        }
        .btn-login:hover:not(:disabled) { transform: translateY(-2px); }
        .btn-login:disabled { opacity: .7; cursor: not-allowed; }
        #loginError {
            display: none; align-items: center; gap: 8px;
            background: #2c1414; color: #fca5a5; border: 1px solid #7f1d1d;
            padding: 11px 13px; border-radius: 8px; margin-top: 14px;
            font-size: 13px; font-weight: 600;
        }
        .footer-note { margin-top: 18px; font-size: 11.5px; color: #64748b; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-circle"><i class="fas fa-print"></i></div>
        <h2>Bro Tech</h2>
        <div class="subtitle">تسجيل الدخول - لوحة تحكم ProTech ERP</div>
        <form onsubmit="attemptLogin(event)">
            <div class="form-group">
                <label><i class="fas fa-lock"></i> كلمة المرور</label>
                <input type="password" id="passwordInput" required autofocus placeholder="أدخل كلمة المرور">
            </div>
            <button type="submit" class="btn-login" id="loginBtn"><i class="fas fa-right-to-bracket"></i> دخول</button>
        </form>
        <div id="loginError"><i class="fas fa-triangle-exclamation"></i> كلمة المرور غير صحيحة، حاول مرة أخرى.</div>
        <div class="footer-note">يمكن تغيير كلمة المرور لاحقاً من صفحة الإعدادات داخل لوحة التحكم.</div>
    </div>
</body>
</html>
