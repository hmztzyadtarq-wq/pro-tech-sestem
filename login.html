<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام برو تيك ERP</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #334155;
        }
        .login-logo {
            font-size: 50px;
            color: #38bdf8;
            margin-bottom: 15px;
        }
        .login-card h2 {
            margin-bottom: 5px;
            color: #f8fafc;
        }
        .login-card p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #cbd5e1;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #475569;
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }
        .form-group input:focus {
            border-color: #38bdf8;
            outline: none;
        }
        .btn-login {
            background: #0284c7;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-login:hover {
            background: #0284c7dd;
        }
        .error-msg {
            color: #f43f5e;
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-logo">
            <i class="fas fa-microchip"></i>
        </div>
        <h2>شركة برو تيك</h2>
        <p>تسجيل الدخول لنظام إدارة الموارد (ERP)</p>
        
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label><i class="fas fa-user"></i> اسم المستخدم / البريد</label>
                <input type="text" id="loginUser" required placeholder="أدخل اسم المستخدم...">
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> كلمة المرور</label>
                <input type="password" id="loginPass" required placeholder="أدخل كلمة المرور...">
            </div>
            <button type="submit" class="btn-login">دخول للنظام</button>
            <div id="errorMsg" class="error-msg">اسم المستخدم أو كلمة المرور غير صحيحة!</div>
        </form>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            let user = document.getElementById('loginUser').value.trim();
            let pass = document.getElementById('loginPass').value.trim();
            
            // بيانات الدخول الافتراضية (يمكنك تعديلها كما تحب)
            // الافتراضي هنا: admin / 123456 أو وائل / 123
            if ((user === 'admin' && pass === '123456') || (user === 'وائل' && pass === '123') || (user === 'protech' && pass === '2026')) {
                localStorage.setItem('protech_logged_in', 'true');
                window.location.href = 'index.html';
            } else {
                let err = document.getElementById('errorMsg');
                err.style.display = 'block';
            }
        }
    </script>
</body>
</html>
