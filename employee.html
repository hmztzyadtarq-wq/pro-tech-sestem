<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الموظف - إنشاء الفواتير والعملاء | ProTech</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f8fafc;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .top-bar {
            background: #0f172a;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .top-bar h2 {
            font-size: 20px;
        }
        .card {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }
        .card h3 {
            margin-bottom: 15px;
            color: #1e293b;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 8px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #475569;
        }
        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }
        .btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn:hover {
            background: #2563eb;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        table th, table td {
            padding: 10px;
            text-align: right;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }
        table th {
            background: #f8fafc;
            color: #475569;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- شريط علوي يوضح أن هذه صفحة الموظف -->
        <div class="top-bar">
            <h2><i class="fas fa-cash-register"></i> نظام الموظف - برو تيك</h2>
            <span>صلاحية: إدخال فواتير وعملاء فقط</span>
        </div>

        <!-- قسم إنشاء فاتورة جديدة -->
        <div class="card">
            <h3><i class="fas fa-file-invoice-dollar"></i> إصدار فاتورة جديدة للمبيعات</h3>
            <div class="form-group">
                <label>اسم العميل</label>
                <input type="text" id="invoiceCustomer" class="form-control" placeholder="مثال: ايهاب سالم">
            </div>
            <div class="form-group">
                <label>تفاصيل الفاتورة / المنتج (مثال: حبر indoor اسود)</label>
                <input type="text" id="invoiceDetails" class="form-control" placeholder="اكتب تفاصيل المنتجات المباعة">
            </div>
            <div class="form-group">
                <label>إجمالي المبلغ (ج.م)</label>
                <input type="number" id="invoiceAmount" class="form-control" placeholder="مثال: 3500">
            </div>
            <button class="btn" onclick="addNewInvoice()">حفظ وإرسال الفاتورة للأدمن</button>
        </div>

        <!-- قسم إضافة عميل جديد لدليل العملاء -->
        <div class="card">
            <h3><i class="fas fa-user-plus"></i> إضافة عميل جديد لدليل العملاء</h3>
            <div class="form-group">
                <label>اسم العميل</label>
                <input type="text" id="clientName" class="form-control" placeholder="اسم العميل الكامل">
            </div>
            <div class="form-group">
                <label>رقم الهاتف / العنوان</label>
                <input type="text" id="clientDetails" class="form-control" placeholder="مثال: شارع فيصل - 010xxxxxxxx">
            </div>
            <button class="btn" onclick="addNewClient()" style="background: #10b981;">حفظ العميل</button>
        </div>

        <!-- عرض الفواتير المسجلة حديثاً من قِبل هذا الموظف -->
        <div class="card">
            <h3><i class="fas fa-list"></i> الفواتير المسجلة اليوم</h3>
            <table>
                <thead>
                    <tr>
                        <th>رقم الفاتورة</th>
                        <th>اسم العميل</th>
                        <th>التفاصيل والمبلغ</th>
                        <th>التاريخ</th>
                    </tr>
                </thead>
                <tbody id="employeeInvoicesList">
                    <!-- يتم جلبها من فايربيز تلقائياً -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // إعدادات اتصال فايربيز (نفس قاعدة البيانات المستخدمة في لوحة الأدمن)
        const firebaseConfig = {
            databaseURL: "https://pro-tech-sestem-default-rtdb.firebaseio.com/"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        // دالة إنشاء وإرسال الفاتورة لـ Firebase (تظهر فوراً في لوحة الأدمن)
        function addNewInvoice() {
            const customer = document.getElementById('invoiceCustomer').value;
            const details = document.getElementById('invoiceDetails').value;
            const amount = document.getElementById('invoiceAmount').value;

            if(!customer || !details || !amount) {
                alert('الرجاء إكمال كافة بيانات الفاتورة!');
                return;
            }

            // توليد رقم فاتورة عشوائي زي النظام عندك
            const invNumber = 'INV-' + Math.floor(1000 + Math.random() * 9000);
            
            // الحصول على تاريخ اليوم وتنسيقه زي الواجهة الرئيسية عندك
            const today = new Date();
            const dateStr = today.getFullYear() + '/' + (today.getMonth() + 1) + '/' + today.getDate();

            // حفظ الفاتورة في مسار مخصص يقرأه الأدمن في لوحته
            const invoicesRef = database.ref('invoices').push();
            invoicesRef.set({
                invNumber: invNumber,
                customer: customer + ' ( ' + details + ' )',
                amount: amount + ' ج.م',
                date: dateStr
            }, (error) => {
                if(error) {
                    alert('حدث خطأ أثناء حفظ الفاتورة!');
                } else {
                    alert('تم إصدار الفاتورة وإرسالها للوحة الإدارة بنجاح!');
                    document.getElementById('invoiceCustomer').value = '';
                    document.getElementById('invoiceDetails').value = '';
                    document.getElementById('invoiceAmount').value = '';
                }
            });
        }

        // دالة إضافة عميل جديد لدليل العملاء ليظهر عند الأدمن
        function addNewClient() {
            const name = document.getElementById('clientName').value;
            const details = document.getElementById('clientDetails').value;

            if(!name) {
                alert('الرجاء إدخال اسم العميل على الأقل!');
                return;
            }

            const clientsRef = database.ref('customers').push();
            clientsRef.set({
                name: name,
                details: details || 'لا يوجد تفاصيل'
            }, (error) => {
                if(error) {
                    alert('حدث خطأ أثناء حفظ العميل!');
                } else {
                    alert('تم إضافة العميل بنجاح لدليل العملاء!');
                    document.getElementById('clientName').value = '';
                    document.getElementById('clientDetails').value = '';
                }
            });
        }

        // متابعة الفواتير وعرضها أول بأول في صفحة الموظف
        database.ref('invoices').on('value', (snapshot) => {
            const tbody = document.getElementById('employeeInvoicesList');
            tbody.innerHTML = '';
            
            snapshot.forEach((childSnapshot) => {
                const inv = childSnapshot.val();
                tbody.innerHTML += `
                    <tr>
                        <td><b>${inv.invNumber}</b></td>
                        <td>${inv.customer}</td>
                        <td>${inv.amount}</td>
                        <td>${inv.date}</td>
                    </tr>
                `;
            });
        });
    </script>
</body>
</html>
