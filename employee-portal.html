<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الحضور والانصراف - برو تيك</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: #0f172a;
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .portal-card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            width: 420px;
            max-width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border: 1px solid #334155;
            text-align: center;
        }
        .portal-card h2 {
            color: #38bdf8;
            margin-bottom: 5px;
        }
        .portal-card p {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #cbd5e1;
        }
        .form-group select {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #475569;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }
        .btn-action {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }
        .btn-checkin {
            background: #10b981;
            color: white;
        }
        .btn-checkin:hover { background: #059669; }
        .btn-checkout {
            background: #ef4444;
            color: white;
        }
        .btn-checkout:hover { background: #dc2626; }
        .status-msg {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="portal-card">
        <h2><i class="fas fa-fingerprint"></i> بوابة الحضور الذكية</h2>
        <p>شركة برو تيك للأحبار وماكينات الطباعة</p>

        <div class="form-group">
            <label>اختر اسمك من القائمة:</label>
            <select id="employeeSelect">
                <option value="">-- اضغط لاختيار اسمك --</option>
            </select>
        </div>

        <button type="button" class="btn-action btn-checkin" onclick="recordAction('checkin')">
            <i class="fas fa-sign-in-alt"></i> تسجيل حضور (بدء العمل)
        </button>

        <button type="button" class="btn-action btn-checkout" onclick="recordAction('checkout')">
            <i class="fas fa-sign-out-alt"></i> تسجيل انصراف (نهاية العمل)
        </button>

        <div id="statusMsg" class="status-msg"></div>
    </div>

    <script>
        // قائمة الموظفين الأساسية والورديات الافتراضية
        const defaultEmployees = [
            { id: '1', name: 'أحمد محمد', role: 'فني صيانة', shiftStart: '09:00', shiftEnd: '17:00' },
            { id: '2', name: 'محمود علي', role: 'مبيعات', shiftStart: '09:00', shiftEnd: '17:00' },
            { id: '3', name: 'إبراهيم حسن', role: 'مشرف طباعة', shiftStart: '08:00', shiftEnd: '16:00' }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            let employees = JSON.parse(localStorage.getItem('broTechManagedEmployees'));
            if (!employees || employees.length === 0) {
                employees = defaultEmployees;
                localStorage.setItem('broTechManagedEmployees', JSON.stringify(employees));
            }

            let select = document.getElementById('employeeSelect');
            employees.forEach(emp => {
                let opt = document.createElement('option');
                opt.value = emp.id;
                opt.textContent = `${emp.name} - (${emp.role})`;
                select.appendChild(opt);
            });
        });

        function recordAction(type) {
            let empId = document.getElementById('employeeSelect').value;
            if (!empId) {
                showMsg('من فضلك اختر اسمك أولاً من القائمة.', 'error');
                return;
            }

            let employees = JSON.parse(localStorage.getItem('broTechManagedEmployees')) || [];
            let emp = employees.find(e => e.id === empId);

            let now = new Date();
            let timeString = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', hour12: false });
            let dateString = now.toLocaleDateString('en-CA'); // تنسيق التاريخ YYYY-MM-DD

            let attendanceLogs = JSON.parse(localStorage.getItem('broTechAttendanceLogs')) || [];
            
            // التحقق من عدم تكرار تسجيل الحضور لنفس اليوم
            let todayLog = attendanceLogs.find(l => l.empId === empId && l.date === dateString);

            if (type === 'checkin') {
                if (todayLog && todayLog.checkIn) {
                    showMsg('لقد قُمست بتسجيل الحضور مسبقاً لهذا اليوم.', 'error');
                    return;
                }
                
                attendanceLogs.push({
                    empId: emp.id,
                    name: emp.name,
                    date: dateString,
                    checkIn: timeString,
                    checkOut: null,
                    status: 'متواجد بالعمل'
                });
                showMsg(`تم تسجيل حضورك بنجاح يا ${emp.name} في تمام الساعة ${timeString}`, 'success');
            } else {
                if (!todayLog || !todayLog.checkIn) {
                    showMsg('يجب تسجيل الحضور أولاً قبل تسجيل الانصراف.', 'error');
                    return;
                }
                if (todayLog.checkOut) {
                    showMsg('لقد تم تسجيل انصرافك مسبقاً اليوم.', 'error');
                    return;
                }

                todayLog.checkOut = timeString;
                todayLog.status = 'انصراف';
                showMsg(`مع السلامة يا ${emp.name}، تم تسجيل انصرافك في تمام الساعة ${timeString}`, 'success');
            }

            localStorage.setItem('broTechAttendanceLogs', JSON.stringify(attendanceLogs));
            
            // تحديث حالة الموظف في اللوحة العامة
            checkAutomaticRules(employees, attendanceLogs);
        }

        // محرك القواعد التلقائية (التأخير والغياب والانصراف التلقائي)
        function checkAutomaticRules(employees, logs) {
            let now = new Date();
            let currentTimeMinutes = now.getHours() * 60 + now.getMinutes();
            let dateString = now.toLocaleDateString('en-CA');

            employees.forEach(emp => {
                let [shHour, shMin] = emp.shiftStart.split(':').map(Number);
                let shiftStartMinutes = shHour * 60 + shMin;
                
                let [ehHour, ehMin] = emp.shiftEnd.split(':').map(Number);
                let shiftEndMinutes = ehHour * 60 + ehMin;

                let log = logs.find(l => l.empId === emp.id && l.date === dateString);

                if (!log) {
                    // لو عدى ساعتين على ميعاد الحضور الرسمي ولم يسجل -> غياب تلقائي
                    if (currentTimeMinutes >= (shiftStartMinutes + 120)) {
                        logs.push({
                            empId: emp.id,
                            name: emp.name,
                            date: dateString,
                            checkIn: '-',
                            checkOut: '-',
                            status: 'غائب (تلقائي)'
                        });
                    }
                } else {
                    // لو سجل حضور ومتأخر (بعد ميعاد الحضور بفترة سماح 15 دقيقة)
                    let [inH, inM] = log.checkIn !== '-' ? log.checkIn.split(':').map(Number) : [0,0];
                    let inMinutes = inH * 60 + inM;
                    if (log.checkIn !== '-' && inMinutes > (shiftStartMinutes + 15) && log.status === 'متواجد بالعمل') {
                        log.status = 'متأخر';
                    }

                    // انصراف تلقائي لو انتهى وقت الوردية والموظف نسي يسجيل انصراف
                    if (log.checkIn !== '-' && !log.checkOut && currentTimeMinutes >= (shiftEndMinutes + 60)) {
                        log.checkOut = emp.shiftEnd;
                        log.status = 'انصراف (تلقائي)';
                    }
                }
            });

            localStorage.setItem('broTechAttendanceLogs', JSON.stringify(logs));
        }

        function showMsg(text, type) {
            let msgDiv = document.getElementById('statusMsg');
            msgDiv.style.display = 'block';
            msgDiv.textContent = text;
            if (type === 'success') {
                msgDiv.style.background = '#065f46';
                msgDiv.style.color = '#34d399';
            } else {
                msgDiv.style.background = '#991b1b';
                msgDiv.style.color = '#fca5a5';
            }
        }
    </script>
</body>
</html>
