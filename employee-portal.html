<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الحضور السحابي - برو تيك</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبات Firebase Firestore الإصدار 12 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updatedoc, getDoc } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDLD-Y6d7LcyqB0rf3YYbJLTFHDXUsWQNM",
            authDomain: "protech-system.firebaseapp.com",
            projectId: "protech-system",
            storageBucket: "protech-system.firebasestorage.app",
            messagingSenderId: "184422532312",
            appId: "1:184422532312:web:76df7769c281c66fca43ad",
            measurementId: "G-1RRP97BPJC"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const COMPANY_LAT = 30.139719; 
        const COMPANY_LNG = 31.390727; 
        const ALLOWED_DISTANCE_METERS = 400; 

        // بصمة الهاتف لمنع التسجيل من أجهزة متعددة
        function getDeviceToken() {
            let deviceId = localStorage.getItem('protech_device_unique_id');
            if (!deviceId) {
                deviceId = 'device_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
                localStorage.setItem('protech_device_unique_id', deviceId);
            }
            return deviceId;
        }

        // جلب أسماء الموظفين من Firestore عند فتح الصفحة
        window.loadEmployees = async function() {
            let select = document.getElementById('employeeSelect');
            try {
                // افترضنا أن الموظفين مخزنين في مجموعة باسم 'employees' أو حسب طريقة تخزينك في الآدمن
                // يمكنك تعديل اسم الـ collection إذا كان مختلفاً لديك
                const querySnapshot = await getDocs(collection(db, "employees"));
                select.innerHTML = '<option value="">-- اختر اسمك من القائمة --</option>';
                
                querySnapshot.forEach((docSnap) => {
                    let emp = docSnap.data();
                    let opt = document.createElement('option');
                    opt.value = docSnap.id; // تخزين معرف الوثيقة (Document ID)
                    opt.textContent = emp.name + (emp.role ? ` (${emp.role})` : '');
                    select.appendChild(opt);
                });
            } catch (error) {
                console.error("خطأ في جلب الموظفين: ", error);
                select.innerHTML = '<option value="">خطأ في الاتصال بقاعدة البيانات</option>';
            }
        };

        function calculateDistance(lat1, lon1, lat2, lon2) {
            function toRad(x) { return x * Math.PI / 180; }
            let R = 6371000;
            let dLat = toRad(lat2 - lat1);
            let dLon = toRad(lon2 - lon1);
            let a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                    Math.sin(dLon / 2) * Math.sin(dLon / 2);
            let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        window.verifyAndCheckin = async function(e) {
            e.preventDefault();
            let empId = document.getElementById('employeeSelect').value;
            let successBox = document.getElementById('successMsg');
            let errorBox = document.getElementById('errorMsg');
            
            successBox.style.display = 'none';
            errorBox.style.display = 'none';

            if (!empId) {
                errorBox.style.display = 'block';
                errorBox.innerHTML = 'يرجى اختيار اسم الموظف أولاً.';
                return;
            }

            if (!navigator.geolocation) {
                errorBox.style.display = 'block';
                errorBox.innerHTML = 'متصفحك لا يدعم خاصية تحديد الموقع الجغرافي.';
                return;
            }

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    let userLat = position.coords.latitude;
                    let userLng = position.coords.longitude;
                    let distance = calculateDistance(userLat, userLng, COMPANY_LAT, COMPANY_LNG);

                    if (distance <= ALLOWED_DISTANCE_METERS) {
                        let currentDevice = getDeviceToken();
                        
                        try {
                            const empRef = doc(db, "employees", empId);
                            const empSnap = await getDoc(empRef);

                            if (empSnap.exists()) {
                                let emp = empSnap.data();

                                // التحقق من قفل الجهاز
                                if (emp.deviceId && emp.deviceId !== currentDevice) {
                                    errorBox.style.display = 'block';
                                    errorBox.innerHTML = 'عذراً، هذا الحساب مسجل بالفعل على هاتف شخصي آخر ولا يمكن تسجيل الحضور من هذا الهاتف!';
                                    return;
                                }

                                let updateData = {
                                    status: 'حاضر',
                                    arrivedAt: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })
                                };

                                if (!emp.deviceId) {
                                    updateData.deviceId = currentDevice;
                                }

                                // تحديث الحضور في Firestore لتتحدث الآدمن فوراً
                                await updateDoc(empRef, updateData);

                                successBox.style.display = 'block';
                                successBox.innerHTML = `<i class="fas fa-check-circle"></i> أهلاً بك يا <b>${emp.name}</b>، تم تسجيل حضورك بنجاح!`;
                            } else {
                                errorBox.style.display = 'block';
                                errorBox.innerHTML = 'الموظف غير موجود في قاعدة البيانات.';
                            }
                        } catch (err) {
                            console.error(err);
                            errorBox.style.display = 'block';
                            errorBox.innerHTML = 'حدث خطأ أثناء الاتصال بقاعدة البيانات لتسجيل الحضور.';
                        }

                    } else {
                        errorBox.style.display = 'block';
                        errorBox.innerHTML = `عذراً، أنت خارج نطاق الشركة! مسافتك الحالية تقريباً ${Math.round(distance)} متر (الحد المسموح 400 متر).`;
                    }
                },
                (error) => {
                    errorBox.style.display = 'block';
                    errorBox.innerHTML = 'فشل في تحديد موقعك. يرجى تفعيل الـ GPS والسماح للمتصفح بالوصول لموقعك.';
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        };

        window.onload = function() {
            loadEmployees();
        };
    </script>

    <style>
        body { font-family: 'Cairo', sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .checkin-card { background: #1e293b; padding: 30px; border-radius: 12px; width: 420px; max-width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; border: 1px solid #334155; }
        .logo-circle { width: 60px; height: 60px; background: #0284c7; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; margin: 0 auto 15px; }
        h2 { color: #38bdf8; margin-bottom: 5px; }
        p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #cbd5e1; }
        select { width: 100%; padding: 10px; background: #0f172a; color: #fff; border: 1px solid #475569; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        select option { background: #0f172a; color: #fff; }
        .btn-checkin { width: 100%; padding: 12px; background: #10b981; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; transition: 0.3s; }
        .btn-checkin:hover { background: #059669; }
        #successMsg { display: none; background: #dcfce7; color: #166534; padding: 12px; border-radius: 6px; margin-top: 15px; font-weight: bold; font-size: 14px; text-align: right; }
        #errorMsg { display: none; background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 6px; margin-top: 15px; font-weight: bold; font-size: 14px; text-align: right; }
    </style>
</head>
<body>

    <div class="checkin-card">
        <div class="logo-circle"><i class="fas fa-cloud-upload-alt"></i></div>
        <h2>تسجيل الحضور السحابي</h2>
        <p>سجل حضورك من هاتفك الشخصي داخل نطاق الشركة (400 متر)</p>
        
        <form onsubmit="verifyAndCheckin(event)">
            <div class="form-group">
                <label><i class="fas fa-user"></i> اسم الموظف:</label>
                <select id="employeeSelect" required>
                    <option value="">-- جاري تحميل أسماء الموظفين من القاعدة --</option>
                </select>
            </div>
            <button type="submit" class="btn-checkin"><i class="fas fa-check-circle"></i> تأكيد وحفظ الحضور</button>
        </form>

        <div id="successMsg"></div>
        <div id="errorMsg"></div>
    </div>
</body>
</html>
