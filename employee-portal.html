<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الحضور الذكي - برو تيك</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .checkin-card { background: #1e293b; padding: 30px; border-radius: 12px; width: 400px; max-width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; border: 1px solid #334155; }
        .logo-circle { width: 60px; height: 60px; background: #0284c7; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; margin: 0 auto 15px; }
        h2 { color: #38bdf8; margin-bottom: 5px; }
        p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #cbd5e1; }
        input { width: 100%; padding: 10px; background: #0f172a; color: #fff; border: 1px solid #475569; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .btn-checkin { width: 100%; padding: 12px; background: #10b981; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; transition: 0.3s; }
        .btn-checkin:hover { background: #059669; }
        #successMsg { display: none; background: #dcfce7; color: #166534; padding: 12px; border-radius: 6px; margin-top: 15px; font-weight: bold; font-size: 14px; }
        #errorMsg { display: none; background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 6px; margin-top: 15px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <div class="checkin-card">
        <div class="logo-circle"><i class="fas fa-map-marker-alt"></i></div>
        <h2>تسجيل الحضور بالموقع</h2>
        <p>يجب أن تكون داخل نطاق مقر الشركة (400 متر) لتسجيل الحضور بنجاح</p>
        
        <form onsubmit="verifyLocationAndCheckin(event)">
            <div class="form-group">
                <label><i class="fas fa-barcode"></i> كود الموظف أو مسح الباركود:</label>
                <input type="text" id="employeeBarcode" required placeholder="امسح الباركود هنا..." autofocus>
            </div>
            <button type="submit" class="btn-checkin"><i class="fas fa-check-circle"></i> التحقق وتسجيل الحضور</button>
        </form>

        <div id="successMsg"></div>
        <div id="errorMsg"></div>
    </div>

    <script>
        // إحداثيات مقر الشركة والنطاق المسموح (400 متر)
        const COMPANY_LAT = 30.139719; 
        const COMPANY_LNG = 31.390727; 
        const ALLOWED_DISTANCE_METERS = 400; 

        // دالة لحساب المسافة بين نقطتين جغرافيتين (بالمتر)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            function toRad(x) { return x * Math.PI / 180; }
            let R = 6371000; // نصف قطر الأرض بالمتر
            let dLat = toRad(lat2 - lat1);
            let dLon = toRad(lon2 - lon1);
            let a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                    Math.sin(dLon / 2) * Math.sin(dLon / 2);
            let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function verifyLocationAndCheckin(e) {
            e.preventDefault();
            let code = document.getElementById('employeeBarcode').value.trim();
            let successBox = document.getElementById('successMsg');
            let errorBox = document.getElementById('errorMsg');
            
            successBox.style.display = 'none';
            errorBox.style.display = 'none';

            if (!navigator.geolocation) {
                errorBox.style.display = 'block';
                errorBox.innerHTML = 'متصفحك لا يدعم خاصية تحديد الموقع الجغرافي.';
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    let userLat = position.coords.latitude;
                    let userLng = position.coords.longitude;

                    let distance = calculateDistance(userLat, userLng, COMPANY_LAT, COMPANY_LNG);

                    if (distance <= ALLOWED_DISTANCE_METERS) {
                        let employees = JSON.parse(localStorage.getItem('protech_employees')) || [];
                        let emp = employees.find(emp => emp.name.toLowerCase().includes(code.toLowerCase()) || emp.id.toString() === code);

                        if(emp) {
                            emp.status = 'حاضر';
                            let now = new Date();
                            emp.arrivedAt = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
                            
                            localStorage.setItem('protech_employees', JSON.stringify(employees));
                            
                            successBox.style.display = 'block';
                            successBox.innerHTML = `<i class="fas fa-check-circle"></i> أهلاً بك يا ${emp.name}، تم تسجيل حضورك بنجاح (على بعد ${Math.round(distance)} متر من الشركة).`;
                            document.getElementById('employeeBarcode').value = '';
                        } else {
                            errorBox.style.display = 'block';
                            errorBox.innerHTML = 'عذراً، كود الموظف أو الباركود غير مسجل في النظام!';
                        }
                    } else {
                        errorBox.style.display = 'block';
                        errorBox.innerHTML = `عذراً، أنت خارج نطاق الشركة! مسافتك الحالية تقريباً ${Math.round(distance)} متر (الحد المسموح 400 متر).`;
                    }
                },
                (error) => {
                    errorBox.style.display = 'block';
                    errorBox.innerHTML = 'فشل في تحديد موقعك. يرجى تفعيل الـ GPS والسماح للمتصفح بالوصول لموقعك.';
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }
    </script>
</body>
</html>
